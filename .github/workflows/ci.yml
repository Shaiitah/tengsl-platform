name: TENGSL CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  integrity:
    name: Platform integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pyyaml

      - name: Python syntax
        run: |
          python -m compileall -q tengsl-core/app tengsl-core/tests
          python -m compileall -q tengsl-edge/app tengsl-edge/tests

      - name: JavaScript syntax
        run: node --check tengsl-console/app.js

      - name: YAML syntax
        run: |
          python - <<'PY'
          import pathlib, yaml
          for p in [
              pathlib.Path("docker-compose.yml"),
              pathlib.Path("PLATFORM_FEATURES.yml"),
          ]:
              yaml.safe_load(p.read_text(encoding="utf-8"))
              print("OK:", p)
          PY

      - name: Compose validation
        run: docker compose config -q

      - name: Required feature contract
        run: python scripts/release_check.py

  tests:
    name: Backend and edge tests
    runs-on: ubuntu-latest
    needs: integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment
        run: cp .env.example .env

      - name: Build backend and edge images
        run: docker compose build backend edge-agent

      - name: Start dependencies
        run: docker compose up -d postgres mqtt-broker ntfy

      - name: Run backend tests
        run: docker compose run --rm backend python -m pytest -q /app/tests --disable-warnings

      - name: Run edge tests
        run: docker compose run --rm edge-agent python -m pytest -q /app/tests --disable-warnings

      - name: Cleanup
        if: always()
        run: docker compose down -v
